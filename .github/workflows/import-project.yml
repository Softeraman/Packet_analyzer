name: Import project source

on:
  push:
    paths:
      - '.project-import.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit project
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/project-import"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          unzip -q .project-import.zip -d "$tmp"
          top="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$top" ]; then
            top="$tmp"
          fi
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.project-import.zip' "$top/" ./
          rm -f .project-import.zip
          rm -f .github/workflows/import-project.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import complete project source"
          git push
